name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies
        run: pip install -r app/requirements.txt

      - name: Check Python syntax
        run: python -m py_compile app/app.py

      - name: Build Docker image
        run: docker build --platform linux/amd64 -t platform-ops-lab:ci ./app

      # A build can succeed even if the application cannot start or serve requests.
      - name: Smoke test running container
        run: |
          set -euo pipefail
          docker run --detach --name platform-api-smoke \
            --publish 127.0.0.1:8080:8080 \
            --env APP_ENV=ci \
            platform-ops-lab:ci

          # Wait for readiness: a new process may refuse or reset early requests.
          ready=0
          for attempt in {1..15}; do
            if curl --fail --silent --show-error --max-time 3 \
              --output health-response.json http://127.0.0.1:8080/health; then
              ready=1
              break
            fi
            echo "Application not ready yet (attempt $attempt/15)"
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then
            echo "::error::Application health endpoint did not become ready"
            exit 1
          fi

          curl --fail --silent --show-error \
            --output index-response.json \
            http://127.0.0.1:8080/

          python - <<'PY'
          import json

          with open("health-response.json", encoding="utf-8") as response:
              assert json.load(response) == {"status": "ok"}, "Unexpected /health response"

          with open("index-response.json", encoding="utf-8") as response:
              app = json.load(response)
          assert app.get("service") == "platform-ops-lab", "Unexpected service response"
          assert app.get("environment") == "ci", "APP_ENV not set in container"
          print("Application smoke tests passed")
          PY

      - name: Show container diagnostics if a check fails
        if: failure()
        run: |
          docker ps -a --filter name=platform-api-smoke
          if docker container inspect platform-api-smoke >/dev/null 2>&1; then
            docker logs platform-api-smoke
          fi

      - name: Clean up smoke-test container
        if: always()
        run: docker rm --force platform-api-smoke || true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check

      - name: Initialise Terraform
        run: terraform -chdir=terraform init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate
