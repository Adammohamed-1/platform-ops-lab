name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies
        run: pip install -r app/requirements.txt

      - name: Check Python syntax
        run: python -m py_compile app/app.py

      - name: Build Docker image
        run: docker build --platform linux/amd64 -t platform-ops-lab:ci ./app

      - name: Smoke test running container
        run: |
          set -e
          docker run -d --name test-api \
            -p 127.0.0.1:8080:8080 \
            -e APP_ENV=ci \
            platform-ops-lab:ci

          # Retry while the application starts.
          for i in {1..10}; do
            if curl -fsS --max-time 3 http://127.0.0.1:8080/health; then
              break
            fi
            sleep 2
          done

          # Fail CI if either endpoint does not respond successfully.
          curl -fsS --max-time 3 http://127.0.0.1:8080/health
          curl -fsS --max-time 3 http://127.0.0.1:8080/

      - name: Show container logs if test fails
        if: failure()
        run: docker logs test-api || true

      - name: Clean up test container
        if: always()
        run: docker rm -f test-api || true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check

      - name: Initialise Terraform
        run: terraform -chdir=terraform init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate
