apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: platform-api
  template:
    metadata:
      labels:
        app: platform-api
    spec:
      containers:
      - name: platform-api
        image: platform-ops-lab:0.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
